name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies without native downloads
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build mobile bundles
        run: npm run build:mobile

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

      - name: Check installer script
        run: bash -n install.sh

      - name: CLI smoke test
        run: |
          node bin/instaling-bot.js version
          node bin/instaling-bot.js help > /dev/null
          node bin/instaling-bot.js stats --json > /dev/null

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build shared core
        run: npm run build:mobile

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

  ios:
    name: iOS unsigned build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build shared core
        run: npm run build:mobile

      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -project InstalingBot.xcodeproj \
            -scheme InstalingBot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build
